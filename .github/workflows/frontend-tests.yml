name: Frontend tests

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: yarn install --frozen-lockfile --ignore-engines
      - run: yarn typecheck
      - run: yarn test --run
      - run: yarn build
