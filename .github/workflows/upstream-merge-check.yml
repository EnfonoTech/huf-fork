name: Upstream merge check

on:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/tridz-dev/huf.git
          git fetch upstream develop
      - name: Trial merge into throwaway branch
        run: |
          git config user.email "ci@enfono.tech"
          git config user.name "CI"
          git checkout -b ci/upstream-probe
          if ! git merge --no-ff --no-commit upstream/develop; then
            echo "Merge conflicts detected. Checking scope…"
            conflicted=$(git diff --name-only --diff-filter=U)
            echo "$conflicted"
            disallowed=$(echo "$conflicted" | grep -vE "^(frontend/src/v3/|frontend/src/App.tsx|frontend/src/components/app-sidebar.tsx)$" || true)
            if [ -n "$disallowed" ]; then
              echo "::error::Conflicts outside v3 scope: $disallowed"
              exit 1
            fi
            echo "Conflicts in-scope (v3/ or known hotspots). Needs manual resolve but no architecture change."
          fi
          git merge --abort 2>/dev/null || true
